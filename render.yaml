# Render Blueprint for AI Detection Application
# https://render.com/docs/blueprint-spec

services:
  # Backend Spring Boot API
  - type: web
    name: ai-detection-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: "8080"
      - key: DB_URL
        value: jdbc:postgresql://ep-hidden-mouse-a1n9zyci-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: DB_USER
        value: neondb_owner
      - key: DB_PASSWORD
        value: npg_IBjy0zaArkq3
      - key: MISTRAL_API_KEY
        value: hJA6cDSdNp5jkD1zxtaWJLJMUZyYoAxq
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,https://ai-detection-frontend.onrender.com

  # Frontend Static Site
  - type: web
    name: ai-detection-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ai-detection-sjtr.onrender.com
