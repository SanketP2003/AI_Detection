spring:
  application:
    name: ai_verify
  main:
    web-application-type: servlet
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update  # Changed from validate to update to auto-create schema
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
  session:
    store-type: none
    timeout: 1800

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    urls-primary-name: "AI Verify API"
    display-request-duration: true
    show-extensions: true
    doc-expansion: list
    deep-linking: true
    layout: "StandaloneLayout"
  model-converters:
    use-spring-boot-default-flattening: true
  paths-to-match:
    - /api/**
  remove-broken-model-converter: true
  show-actuator: false

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: strict
        secure: true
        http-only: true
        path: /
        max-age: 3600
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

# Mistral AI Configuration
mistralmodel:
  api:
    url: https://api.mistral.ai/v1/chat/completions
    key: ${MISTRAL_API_KEY}
  model: mistral-large-latest
  temperature: 0.7
  max-tokens: 600

# Security Configuration
security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  rate-limit:
    enabled: true
    login:
      max-attempts: ${SECURITY_RATE_LIMIT_LOGIN_MAX_ATTEMPTS:5}
      window-seconds: ${SECURITY_RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
    api:
      max-requests: ${SECURITY_RATE_LIMIT_API_MAX_REQUESTS:100}
      window-seconds: ${SECURITY_RATE_LIMIT_API_WINDOW_SECONDS:60}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,https://ai-detection-frontend.onrender.com,https://ai-detection-sjtr.onrender.com}

# Actuator (for health checks only)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Logging
logging:
  level:
    root: INFO
    com.springboot.ai_verify: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
