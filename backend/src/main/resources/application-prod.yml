spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      max-lifetime: 1200000
      idle-timeout: 600000
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CLERK_ISSUER_URI:https://fond-teal-84.clerk.accounts.dev}
          jwk-set-uri: ${CLERK_JWK_SET_URI:https://fond-teal-84.clerk.accounts.dev/.well-known/jwks.json}

clerk:
  secret-key: ${CLERK_SECRET_KEY:}
  issuer: ${CLERK_ISSUER_URI:https://fond-teal-84.clerk.accounts.dev}

openrouter:
  api:
    url: ${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
    key: ${OPENROUTER_API_KEY:}
  model:
    detection: ${OPENROUTER_DETECTION_MODEL:google/gemini-2.5-flash}
    advisor: ${OPENROUTER_ADVISOR_MODEL:google/gemini-2.5-flash}

mistral:
  api:
    url: ${MISTRAL_API_URL:https://api.mistral.ai/v1/chat/completions}
    key: ${MISTRAL_API_KEY:}
  detection:
    model: ${MISTRAL_DETECTION_MODEL:mistral-large-latest}


server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never