spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_verify}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      max-lifetime: 1200000
      idle-timeout: 600000
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope:
              - email
              - profile

mistral:
  api:
    url: ${MISTRAL_API_URL:https://api.mistral.ai/v1/chat/completions}
    key: ${MISTRAL_API_KEY:}
  detection:
    model: ${MISTRAL_DETECTION_MODEL:mistral-large-latest}

gemini:
  api:
    key: ${GEMINI_API_KEY:}


server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always