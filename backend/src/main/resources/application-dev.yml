spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_verify}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      max-lifetime: 1200000
      idle-timeout: 600000
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CLERK_ISSUER_URI:https://fond-teal-84.clerk.accounts.dev}
          jwk-set-uri: ${CLERK_JWK_SET_URI:https://fond-teal-84.clerk.accounts.dev/.well-known/jwks.json}

clerk:
  secret-key: ${CLERK_SECRET_KEY:}
  issuer: ${CLERK_ISSUER_URI:https://fond-teal-84.clerk.accounts.dev}

openrouter:
  api:
    url: ${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
    key: ${OPENROUTER_API_KEY:}
  model:
    detection: ${OPENROUTER_DETECTION_MODEL:google/gemini-2.5-flash}
    advisor: ${OPENROUTER_ADVISOR_MODEL:google/gemini-2.5-flash}


server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always