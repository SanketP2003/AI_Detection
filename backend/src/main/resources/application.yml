spring:
  application:
    name: ai_verify
  main:
    web-application-type: servlet
    allow-bean-definition-overriding: true
  mvc:
    async:
      request-timeout: 60000
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 1200000
      idle-timeout: 600000
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  session:
    store-type: none
    timeout: 1800

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    urls-primary-name: "AI Verify API"
    display-request-duration: true
    show-extensions: true
    doc-expansion: list
    deep-linking: true
    layout: "StandaloneLayout"
  paths-to-match:
    - /api/**
  show-actuator: true

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
        http-only: true
        path: /
      timeout: 7200

mistralmodel:
  api:
    url: https://api.mistral.ai/v1/chat/completions
    key: ${MISTRAL_API_KEY}
  model: mistral-large-latest
  temperature: 0.7
  max-tokens: 600

# Security settings
security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
