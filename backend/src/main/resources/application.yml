spring:
  application:
    name: ai_verify
  main:
    web-application-type: servlet
    allow-bean-definition-overriding: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    async:
      request-timeout: 60000
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  session:
    store-type: none
    timeout: 1800

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    urls-primary-name: "Guardian Verify API"
    display-request-duration: true
    show-extensions: true
    doc-expansion: list
    deep-linking: true
    layout: "StandaloneLayout"
  paths-to-match:
    - /api/**
  show-actuator: true

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}
        http-only: true
        path: /
      timeout: 7200
security:
  rate-limit:
    enabled: ${SECURITY_RATE_LIMIT_ENABLED:true}
    trust-proxy: ${SECURITY_RATE_LIMIT_TRUST_PROXY:false}
    login:
      max-attempts: ${SECURITY_RATE_LIMIT_LOGIN_MAX_ATTEMPTS:5}
      window-seconds: ${SECURITY_RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
    api:
      max-requests: ${SECURITY_RATE_LIMIT_API_MAX_REQUESTS:100}
      window-seconds: ${SECURITY_RATE_LIMIT_API_WINDOW_SECONDS:60}

billing:
  enabled: ${BILLING_ENABLED:false}
  provider: ${BILLING_PROVIDER:stripe}
  trial-days: ${BILLING_TRIAL_DAYS:14}
  grace-days: ${BILLING_GRACE_DAYS:7}
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    portal-configuration-id: ${STRIPE_PORTAL_CONFIGURATION_ID:}
    price-pro-monthly: ${STRIPE_PRICE_PRO_MONTHLY:}
    price-pro-yearly: ${STRIPE_PRICE_PRO_YEARLY:}
    price-team-monthly: ${STRIPE_PRICE_TEAM_MONTHLY:}

app:
  plans:
    catalog:
      free:
        id: FREE
        name: Free
        price-monthly-cents: 0
        price-yearly-cents: 0
        monthly-scans: 20
        max-chars-per-analysis: 5000
        max-upload-bytes: 2097152
        monthly-advisor-messages: 10
        history-retention-days: 30
        max-seats: 1
        export-enabled: false
        api-access-enabled: false
        support-tier: Community
        overage-allowed: false
      pro:
        id: PRO
        name: Pro
        price-monthly-cents: 1900
        price-yearly-cents: 19000
        monthly-scans: 1000
        max-chars-per-analysis: 50000
        max-upload-bytes: 10485760
        monthly-advisor-messages: 300
        history-retention-days: 365
        max-seats: 1
        export-enabled: true
        api-access-enabled: false
        support-tier: Email
        overage-allowed: true
      team:
        id: TEAM
        name: Team
        price-monthly-cents: 4900
        price-yearly-cents: 49000
        monthly-scans: 10000
        max-chars-per-analysis: 200000
        max-upload-bytes: 26214400
        monthly-advisor-messages: 2000
        history-retention-days: 730
        max-seats: 25
        export-enabled: true
        api-access-enabled: true
        support-tier: Priority Email
        overage-allowed: true

