spring:
  application:
    name: ai_verify
  main:
    web-application-type: servlet
    allow-bean-definition-overriding: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    async:
      request-timeout: 60000
  session:
    store-type: none
    timeout: 1800

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    urls-primary-name: "AI Verify API"
    display-request-duration: true
    show-extensions: true
    doc-expansion: list
    deep-linking: true
    layout: "StandaloneLayout"
  paths-to-match:
    - /api/**
  show-actuator: true

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}
        http-only: true
        path: /
      timeout: 7200

