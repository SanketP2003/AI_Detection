spring:
  application:
    name: ai_verify
  main:
    web-application-type: servlet
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  session:
    store-type: none
    timeout: 1800

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
        http-only: true
        path: /

mistralmodel:
  api:
    url: https://api.mistral.ai/v1/chat/completions
    key: ${MISTRAL_API_KEY}
  model: mistral-large-latest
  temperature: 0.7
  max-tokens: 600


